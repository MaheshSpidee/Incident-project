services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
      POSTGRES_DB: incident_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incident_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://incident:incident@postgres:5432/incident_dev?schema=public
      JWT_SECRET: dev-secret-change-me-dev-secret-change-me
      INGESTION_API_KEY: dev-ingestion-key
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://incident:incident@postgres:5432/incident_dev?schema=public
      JWT_SECRET: dev-secret-change-me-dev-secret-change-me
      INGESTION_API_KEY: dev-ingestion-key
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    command: npm run start

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://incident:incident@postgres:5432/incident_dev?schema=public
      JWT_SECRET: dev-secret-change-me-dev-secret-change-me
      INGESTION_API_KEY: dev-ingestion-key
      ESCALATION_THRESHOLD_SECONDS: 300
      ESCALATION_CHECK_INTERVAL_SECONDS: 10
      ESCALATION_BATCH_SIZE: 50
    command: npm run worker

  frontend:
    build:
      context: .
      dockerfile: front-end/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata:
